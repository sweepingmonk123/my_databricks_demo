# This is a Databricks asset bundle definition for zhangli_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: zhangli_pipeline
  uuid: 1e1373d8-6013-461c-9bf4-e76910fd0f4c

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1e07dec2-8d2c.cloud.databricks.com
    variables:
      catalog: dataleap_test
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-1e07dec2-8d2c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/zhangli.2022@bytedance.com to make sure we only have a single copy.
      root_path: /Workspace/Users/zhangli.2022@bytedance.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dataleap_test
      schema: prod
    permissions:
      - user_name: zhangli.2022@bytedance.com
        level: CAN_MANAGE
